<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbra — Confidential AMM on Midnight</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#050505',
                            orange: '#FF5733',
                            orangeHover: '#E04C2C'
                        }
                    },
                    fontFamily: {
                        heading: ['"Bebas Neue"', 'sans-serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            /* Hide scrollbar for clean look */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }
        
        ::selection {
            background-color: #FF5733;
            color: #ffffff;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="antialiased min-h-screen relative overflow-hidden flex flex-col">

    <!-- Header Navigation -->
    <header class="absolute top-0 w-full z-20 px-8 py-8 flex items-center justify-between mix-blend-difference">
        <!-- Logo -->
        <div class="w-[200px]">
            <a href="#" class="text-xl font-semibold tracking-[0.4em] flex items-center">
                <span>UM</span><span class="text-brand-orange">B</span><span>RA</span>
            </a>
        </div>
        
        <!-- Center Nav -->
        <nav class="hidden lg:flex items-center space-x-12">
            <a href="#" class="text-[10px] font-semibold tracking-[0.2em] text-brand-orange duration-300">HOME</a>
            <a href="#" class="text-[10px] font-semibold tracking-[0.2em] text-gray-300 hover:text-white duration-300">MARKET</a>
            <a href="#" class="text-[10px] font-semibold tracking-[0.2em] text-gray-300 hover:text-white duration-300">TRADE</a>
            <a href="#" class="text-[10px] font-semibold tracking-[0.2em] text-gray-300 hover:text-white duration-300">DOCS</a>
            <a href="#" class="text-[10px] font-semibold tracking-[0.2em] text-gray-300 hover:text-white duration-300">ABOUT</a>
        </nav>

        <!-- Right Actions -->
        <div class="w-[200px] flex items-center justify-end space-x-6">
            <!-- Dark mode toggle placeholder (could be an icon) -->
            <button class="text-gray-300 hover:text-white transition-colors" aria-label="Toggle dark mode">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
            <button onclick="connectWallet()" class="group flex items-center space-x-2 bg-brand-orange hover:bg-brand-orangeHover text-white px-5 py-2.5 rounded-sm transition-all duration-300 text-[10px] font-semibold tracking-[0.2em]">
                <span>LAUNCH APP</span>
                <svg class="w-3 h-3 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </header>

    <!-- Hero Section -->
    <main id="hero-section" class="relative z-10 flex-grow flex items-center px-8 md:px-16 pt-24 pb-16 overflow-hidden">
        
        <!-- Background Canvas & Overlays -->
        <canvas id="particle-canvas" class="absolute inset-0 w-full h-full z-0"></canvas>
        <div class="absolute inset-0 z-10 bg-gradient-to-b from-black/80 via-black/30 to-transparent pointer-events-none"></div>
        <div class="absolute inset-0 z-10 bg-black/10 pointer-events-none"></div>

        <!-- Left Content -->
        <div class="relative z-20 max-w-2xl mt-16 w-full">
            <h1 class="font-heading text-6xl lg:text-[7.5rem] leading-[0.9] drop-shadow-xl uppercase">
                <div class="text-white">TRADE WITHOUT</div>
                <div class="text-brand-orange">BEING SEEN</div>
                <div class="text-white">SETTLE ON-CHAIN</div>
            </h1>
            
            <p class="mt-6 text-gray-300 text-sm md:text-base max-w-sm leading-relaxed">
                A confidential automated market maker on Midnight. Order size and side stay private end-to-end — settlement is still verifiable on-chain.
            </p>
            
            <div class="mt-8 flex flex-col sm:flex-row gap-4">
                <button onclick="connectWallet()" class="group flex items-center justify-center space-x-2 bg-brand-orange hover:bg-brand-orangeHover text-white px-8 py-4 rounded-sm transition-all duration-300 text-xs font-semibold tracking-[0.2em]">
                    <span>LAUNCH APP</span>
                    <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
                <button class="group glass-panel hover:bg-white/10 text-white px-8 py-4 rounded-sm transition-all duration-300 text-xs font-semibold tracking-[0.2em]">
                    HOW IT WORKS
                </button>
            </div>
        </div>

        <!-- Right Side Indicators -->
        <div class="hidden lg:flex absolute right-16 top-1/2 -translate-y-1/2 flex-col space-y-10 z-20">
            <!-- 01 COMMIT -->
            <div class="group flex items-center cursor-pointer">
                <div class="w-4 text-[10px] font-semibold tracking-[0.2em] text-brand-orange font-mono">01</div>
                <div class="ml-6 text-[10px] font-semibold tracking-[0.3em] text-white transition-colors duration-300">COMMIT</div>
            </div>
            <!-- 02 MATCH -->
            <div class="group flex items-center cursor-pointer">
                <div class="w-4 text-[10px] font-semibold tracking-[0.2em] text-gray-500 group-hover:text-white transition-colors font-mono">02</div>
                <div class="ml-6 text-[10px] font-semibold tracking-[0.3em] text-gray-500 group-hover:text-white transition-colors duration-300">MATCH</div>
            </div>
            <!-- 03 SETTLE -->
            <div class="group flex items-center cursor-pointer">
                <div class="w-4 text-[10px] font-semibold tracking-[0.2em] text-gray-500 group-hover:text-white transition-colors font-mono">03</div>
                <div class="ml-6 text-[10px] font-semibold tracking-[0.3em] text-gray-500 group-hover:text-white transition-colors duration-300">SETTLE</div>
            </div>
            <!-- 04 WITHDRAW -->
            <div class="group flex items-center cursor-pointer">
                <div class="w-4 text-[10px] font-semibold tracking-[0.2em] text-gray-500 group-hover:text-white transition-colors font-mono">04</div>
                <div class="ml-6 text-[10px] font-semibold tracking-[0.3em] text-gray-500 group-hover:text-white transition-colors duration-300">WITHDRAW</div>
            </div>
        </div>
        
    </main>

    <!-- Canvas Animation Script -->
    <script>
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        const heroSection = document.getElementById('hero-section');
        
        let width, height;
        let particles = [];
        let rings = [];
        let animationId;
        
        function resize() {
            if (!heroSection) return;
            // Get dimensions of the hero container, not the window
            const rect = heroSection.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            width = rect.width;
            height = rect.height;
            
            // Set actual canvas resolution based on devicePixelRatio
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            
            // Normalize coordinate system to use CSS pixels
            ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset
            ctx.scale(dpr, dpr);
        }
        
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5;
                // Lifecycle 2-4 seconds (at 60fps, 120-240 frames)
                this.life = 0;
                this.maxLife = Math.random() * 120 + 120;
                
                // 1 in 20 pulses orange
                this.isMatch = Math.random() < 0.05;
                
                // Drift slightly
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
            }
            
            update() {
                this.life++;
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.life >= this.maxLife) {
                    this.reset();
                }
            }
            
            draw(ctx) {
                // Fade in and out between 0 and 0.4 opacity max (slightly more visible)
                let opacity = 0;
                const halfLife = this.maxLife / 2;
                const maxOpacity = 0.4;
                
                if (this.life < halfLife) {
                    opacity = (this.life / halfLife) * maxOpacity;
                } else {
                    opacity = (1 - (this.life - halfLife) / halfLife) * maxOpacity;
                }
                
                let color = `rgba(255, 255, 255, ${opacity})`;
                
                // Pulse orange effect (#FF5733 = 255, 87, 51)
                if (this.isMatch && this.life > this.maxLife * 0.8) {
                    const pulseIntensity = Math.sin((this.life - this.maxLife * 0.8) / (this.maxLife * 0.2) * Math.PI);
                    color = `rgba(255, 87, 51, ${opacity + pulseIntensity * 0.5})`;
                    this.size = 1.5 + pulseIntensity;
                }

                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.restore();
            }
        }

        class Ring {
            constructor(radius, speed, color, lineWidth, startAngleOffset, arcLength) {
                this.radius = radius;
                this.speed = speed;
                this.color = color;
                this.lineWidth = lineWidth;
                this.startAngleOffset = startAngleOffset;
                this.arcLength = arcLength;
                this.angle = 0;
            }
            
            update() {
                this.angle += this.speed;
            }
            
            draw(ctx, centerX, centerY) {
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(this.angle);
                
                ctx.beginPath();
                // Draw partial arc
                ctx.arc(0, 0, this.radius, this.startAngleOffset, this.startAngleOffset + this.arcLength);
                
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.lineWidth;
                ctx.shadowBlur = 35; // Bright glow
                ctx.shadowColor = '#FF5733'; // True glow effect
                ctx.lineCap = 'round';
                ctx.stroke();
                
                ctx.restore();
            }
        }

        // Initialize particles (80 as per spec)
        const particleCount = 80;
        for(let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
            // Randomize initial life so they don't all spawn/die at once
            particles[i].life = Math.random() * particles[i].maxLife;
        }

        // Initialize the glowing rings
        // Radii sized for hero focal effect, various speeds and opacities
        rings.push(new Ring(140, 0.003, 'rgba(255, 87, 51, 0.9)', 5, 0, Math.PI * 1.6));
        rings.push(new Ring(180, -0.002, 'rgba(255, 255, 255, 0.4)', 2, Math.PI / 4, Math.PI * 1.2));
        rings.push(new Ring(220, 0.004, 'rgba(255, 87, 51, 0.6)', 3, Math.PI, Math.PI * 1.5));
        rings.push(new Ring(260, -0.0015, 'rgba(255, 87, 51, 0.3)', 1, Math.PI * 1.5, Math.PI * 1.8));
        rings.push(new Ring(100, 0.005, 'rgba(255, 255, 255, 0.6)', 4, Math.PI / 2, Math.PI));

        let frameCount = 0;
        
        function animate() {
            frameCount++;
            // Optional diagnostic logging to verify animation runs:
            // if (frameCount % 60 === 0) console.log('frame', frameCount);
            
            // Clear with a slight trailing effect if desired, but clearRect is safer for glow
            ctx.clearRect(0, 0, width, height);
            
            // Draw secondary particle layer first (underneath)
            particles.forEach(p => {
                p.update();
                p.draw(ctx);
            });
            
            // Draw primary glowing vortex effect on the right side
            // Position behind the COMMIT/MATCH/SETTLE list (right-16 roughly = right: 4rem)
            const rightPadding = width > 1024 ? 200 : width / 2;
            const centerX = width > 1024 ? width - rightPadding : width / 2;
            const centerY = height / 2;
            
            rings.forEach(ring => {
                ring.update();
                ring.draw(ctx, centerX, centerY);
            });
            
            animationId = requestAnimationFrame(animate);
        }
        
        animate();

        // Stub for the connect wallet hook
        function connectWallet() {
            console.log("Calling Layer 3 useWallet().connectWallet() stub");
            alert("This would trigger the 1AM wallet connection via Layer 3 hooks.");
        }
    </script>
</body>
</html>
